name: CI

on:
  # Run once for each PR update; run main once after a merge.
  # Avoid running the full E2E browser installation on both branch push and PR.
  push:
    branches: [main]
  pull_request:

concurrency:
  # A superseding commit on the same PR cancels old CI, not unrelated PRs.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration_check.db
      - run: uv run python -m app.jobs.evaluate_official_snapshot

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_repo_guardrails.py
      - name: Export review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: review-snapshot
          # Export only generated QA evidence; do not archive the entire repo.
          path: |
            reports/official_snapshot/
            evals/retrieval/official_snapshot_judgments.json
          if-no-files-found: error
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm run web:test
      - run: npm --prefix apps/web ci
      - run: npm run web:lint
      - run: npm run web:build

  e2e:
    # Pinned image includes Google Chrome and system browser dependencies.
    # Avoid --with-deps apt downloads that previously stalled E2E jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thai_procurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/thai_procurement
      LLM_PROVIDER: mock
      ENABLE_LLM: "false"
      ENABLE_EMBEDDINGS: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: uv sync --locked
        working-directory: apps/api
      # Rehearse a populated PostgreSQL database upgrading from the prior
      # migration. The importer must not create new ORM tables prematurely.
      - run: uv run alembic upgrade 0002_official_provenance
        working-directory: apps/api
      - run: uv run python -m app.jobs.import_csv --file ../../data/sample/procurement_sample.csv --source sample
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run alembic current
        working-directory: apps/api
      - name: Verify PostgreSQL external inference budget under contention
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import UTC, datetime
          from sqlalchemy import select
          from app.database import SessionLocal
          from app.models import AIHourlyBudget
          from app.services.llm.budget import consume_hourly_budget

          window = datetime(2099, 1, 1, tzinfo=UTC)

          def reserve(_: int) -> bool:
              with SessionLocal() as session:
                  return consume_hourly_budget(session, limit=5, now=window)

          with ThreadPoolExecutor(max_workers=10) as pool:
              outcomes = list(pool.map(reserve, range(24)))

          with SessionLocal() as session:
              row = session.scalar(
                  select(AIHourlyBudget).where(
                      AIHourlyBudget.bucket == "external_llm",
                      AIHourlyBudget.window == "2099010100",
                  )
              )
              assert sum(outcomes) == 5, outcomes
              assert row is not None and row.requests == 5, row
          print("PostgreSQL atomic quota: 5 allowed / 19 denied")
          PY
      - run: uv run python -m app.jobs.generate_embeddings --limit 1000
        working-directory: apps/api
      - run: npm --prefix apps/web ci
      - run: npm run web:build
      - name: Verify preinstalled Google Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Start API
        working-directory: apps/api
        run: uv run uvicorn app.main:app --port 8000 &
      - name: Start web
        working-directory: apps/web
        run: npm start &
      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            api_ok=$(curl -sf http://127.0.0.1:8000/api/health || true)
            web_ok=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || true)
            if [ -n "$api_ok" ] && [ "$web_ok" = "200" ]; then
              echo "api: $api_ok"; echo "web: $web_ok"; exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready"; exit 1
      - name: Run browser E2E in preinstalled Chrome
        run: npm run e2e:smoke -- --config=playwright.ci.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
